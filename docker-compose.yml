services:
  mysql:
    image: mysql:8.0
    container_name: mysql_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-db_crud}
      MYSQL_USER: ${DB_USER:-user_crud}
      MYSQL_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - api_outer_bff_neox

  app:
    image: api-bff-neox:latest
    container_name: api-bff-neox-nestjs
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-user_crud}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      DB_NAME: ${DB_NAME:-db_crud}
      LOGGER_LEVEL: ${LOGGER_LEVEL:-info}
      LOGGER_PRETTY: ${LOGGER_PRETTY:-false}
      SECRET_TOKEN_JWT: ${SECRET_TOKEN_JWT:-change_this_secret}
      SEND_GRID_ACCESS_KEY: ${SEND_GRID_ACCESS_KEY:-}
      EMAIL_EMIT: ${EMAIL_EMIT:-}
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - api_outer_bff_neox

networks:
  api_outer_bff_neox:
    driver: bridge

volumes:
  mysql_data:
